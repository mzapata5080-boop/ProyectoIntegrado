<h2>Lista de Trabajadores</h2>
<a href="{% url 'trabajador_create' %}">Agregar Nuevo Trabajador</a>
<table border="1" style="margin-top: 10px;">
    <thead>
        <tr>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>RUT</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for t in trabajadores %}
        <tr>
            <td>{{ t.username }}</td>
            <td>{{ t.first_name }} {{ t.last_name }}</td>
            <td>{{ t.rut }}</td>
            <td>{{ t.email }}</td>
            <td>
                <a href="{% url 'trabajador_update' t.pk %}">Editar</a> | 
                <a href="{% url 'trabajador_delete' t.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No hay trabajadores registrados.</td></tr>
        {% endfor %}
    </tbody>
</table>
