{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Eliminar Cliente</h2>

    <p>

        ¿Está seguro de eliminar
        <strong>

            {{ object.razon_social }}

        </strong>?

    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger">

            Confirmar Eliminación

        </button>

    </form>

</div>

{% endblock %}
